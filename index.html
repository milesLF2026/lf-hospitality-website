<!DOCTYPE html>
<html lang="en">
<head>

<title>LI & FUNG HOSPITALITY — Hotel Supplies</title>
<link rel="stylesheet" href="styles.css" />
</head>
<body>

<header class="site-header">
  <div class="wrap header-inner">
    <div class="brand">
      <img src="images/brand/li-fung-logo.png" alt="LI & FUNG" />
      <span class="brand-hospitality">HOSPITALITY</span>
    </div>
    <nav>
      <a href="#home" aria-current="page">Home</a>
