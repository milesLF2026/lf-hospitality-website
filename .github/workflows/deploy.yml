# On every push to master, sign in to GCP with Workload Identity Federation (no stored keys)
# and run cloudbuild.yaml on Cloud Build, which builds the image and deploys it to Cloud Run.
name: Deploy to Cloud Run

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-cloud-run
  cancel-in-progress: false

env:
  PROJECT_ID: lft-lfeu-lfhospitalitywebsite
  REGION: asia-southeast1

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/358752073288/locations/global/workloadIdentityPools/github/providers/lf-hospitality-website
          service_account: lf-hospitality-gh-deployer@lft-lfeu-lfhospitalitywebsite.iam.gserviceaccount.com

      - uses: google-github-actions/setup-gcloud@v3

      - name: Build and deploy with Cloud Build
        run: |
          gcloud builds submit \
            --project "$PROJECT_ID" \
            --region "$REGION" \
            --config cloudbuild.yaml \
            --service-account "projects/$PROJECT_ID/serviceAccounts/lf-hospitality-cloudbuild@$PROJECT_ID.iam.gserviceaccount.com" \
            --gcs-source-staging-dir "gs://${PROJECT_ID}_cloudbuild/source"
